<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {%- seo -%}
    <!-- Bootstrap 5 (served from portfolio to stay in sync — upgrading portfolio upgrades blog automatically) -->
    <link rel="stylesheet" href="https://www.andrewdenty.com/assets/css/bootstrap.min.css">
    <!-- Shared portfolio styles (loaded after Bootstrap so overrides win the cascade) -->
    <link rel="stylesheet" type="text/css" href="https://www.andrewdenty.com/assets/css/style.css">
    <!-- Blog-specific styles (loaded last so they override shared styles) -->
    <link rel="stylesheet" href="{{site.baseurl}}/assets/main.css">
    <!-- Bootstrap 5 JS bundle (no jQuery dependency) -->
    <script src="https://www.andrewdenty.com/assets/js/bootstrap.bundle.min.js"></script>
    <link rel="icon" type="image/png" href="{{site.url}}/assets/img/favicon.png" />
    {%- feed_meta -%}
    {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
    {%- endif -%}
</head>
